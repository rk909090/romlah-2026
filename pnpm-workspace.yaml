# Disetel agar cocok dengan lingkungan build Hostinger: pnpm 11.25.0 yang
# dijalankan lewat corepack di Node 22.
#
# minimumReleaseAgeExclude
#   pnpm 11 menolak paket yang baru terbit sebagai perlindungan rantai pasok.
#   Kebijakannya dibiarkan AKTIF — lockfile dibuat ulang oleh pnpm 11 sendiri
#   sehingga resolusinya lolos. Daftar di bawah dihasilkan otomatis oleh pnpm
#   untuk paket Next.js yang versinya dipatok persis di package.json, jadi
#   tidak bisa dimundurkan ke versi yang lebih tua.
minimumReleaseAgeExclude:
  - '@next/env@16.3.4'
  - '@next/eslint-plugin-next@16.3.4'
  - '@next/swc-darwin-arm64@16.3.4'
  - '@next/swc-darwin-x64@16.3.4'
  - '@next/swc-linux-arm64-gnu@16.3.4'
  - '@next/swc-linux-arm64-musl@16.3.4'
  - '@next/swc-linux-x64-gnu@16.3.4'
  - '@next/swc-linux-x64-musl@16.3.4'
  - '@next/swc-win32-arm64-msvc@16.3.4'
  - '@next/swc-win32-x64-msvc@16.3.4'
  - eslint-config-next@16.3.4
  - next@16.3.4

# allowBuilds
#   pnpm 11 keluar dengan kode 1 (strictDepBuilds, bawaan aktif) bila ada
#   dependensi berskrip pascapasang yang belum ditinjau.
#
#   PENTING: di pnpm 11 setelan `onlyBuiltDependencies`, `neverBuiltDependencies`,
#   dan `ignoredBuiltDependencies` SUDAH DIHAPUS dan diganti `allowBuilds`.
#   Kunci lama tidak menimbulkan galat — ia hanya diabaikan diam-diam, sehingga
#   instalasi tetap gagal tanpa petunjuk. Jangan memakai kunci lama di sini.
#
#   Keduanya ditolak (false) karena binernya sudah datang sebagai paket
#   prabangun yang ada di lockfile — @unrs/resolver-binding-linux-x64-gnu dan
#   @img/sharp-linux-x64 — jadi skrip pascapasangnya tidak dibutuhkan, dan
#   menjalankannya justru berisiko memicu kompilasi dari sumber.
allowBuilds:
  sharp: false
  unrs-resolver: false
